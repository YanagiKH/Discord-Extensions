<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Extensions</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1 id="appTitle">Discord Extensions</h1>
          <p id="appSubtitle">Plugin management, settings, and local installs</p>
        </div>
        <div class="toolbar">
          <label class="inline-field">
            <span id="languageLabel">Language</span>
            <select id="languageSelect"></select>
          </label>
          <button id="workbenchBtn" class="primary" type="button" onclick="window.discordExtensions.openWorkbench()">Module workbench</button>
          <button id="importBtn" class="primary">Import plugins</button>
          <button id="refreshBtn" class="secondary">Refresh</button>
          <button id="dataBtn" class="secondary">Open data folder</button>
        </div>
      </header>

      <p id="statusLine" class="detail-empty status-line"></p>

      <main class="layout">
        <section class="panel">
          <h2 id="pluginsHeader">Plugin list</h2>
          <div id="pluginList" class="plugin-list"></div>
        </section>

        <section class="right-column">
          <section class="panel">
            <h2 id="detailsHeader">Plugin details</h2>
            <div id="pluginDetail" class="detail-empty">Select a plugin to edit its settings.</div>
          </section>

          <section class="panel">
            <h2 id="globalSettingsHeader">Global customization</h2>
            <div id="globalSettings" class="settings-grid"></div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
