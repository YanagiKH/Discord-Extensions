name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'mods/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'mods/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and debug APK
        run: gradle -p android clean testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Extensions-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  emulator-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK for emulator
        run: gradle -p android assembleDebug --stacktrace

      - name: Run Android 8.0 emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest --stacktrace
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.yanagikh.discordextensions.debug
            adb shell am start -W -n io.yanagikh.discordextensions.debug/io.yanagikh.discordextensions.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/discord-extensions-ui.xml
            adb pull /sdcard/discord-extensions-ui.xml android-ui.xml
            grep -q 'Discord Extensions' android-ui.xml
            adb logcat -d '*:E' > android-logcat-errors.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: |
            android-ui.xml
            android-logcat-errors.txt
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
