name: CI

on:
  push:
  pull_request:

jobs:
  validate-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop host and workbench
        run: npm run build

      - name: Validate repository layout
        run: npm run validate:repo

      - name: Validate module workbench
        run: npm run validate:workbench

      - name: Validate browser extension bundle
        run: npm run validate:browser-extension

      - name: Validate Android project layout
        run: npm run validate:android

  validate-android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android unit tests and APK build
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace

  validate-python-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile plugins/samples/python-voice-guard/main.py

  validate-go-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - working-directory: plugins/samples/go-quick-actions
        run: go build ./...

  validate-rust-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: plugins/samples/rust-safe-speaker
        run: cargo check

  validate-c-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - working-directory: plugins/samples/c-voice-guard
        run: gcc -std=c11 -Wall -Wextra -Werror main.c -o c-voice-guard

  validate-cpp-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - working-directory: plugins/samples/cpp-compact-sidebar
        run: g++ -std=c++17 -Wall -Wextra -Werror main.cpp -o cpp-compact-sidebar
