<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Discord Extensions desktop module workbench preview</title>
  <desc id="desc">A dark desktop interface with module metadata fields, language selection, actions, and generated output.</desc>
  <rect width="1200" height="700" rx="28" fill="#10131a"/>
  <rect x="28" y="28" width="1144" height="64" rx="16" fill="#1b2030"/>
  <circle cx="60" cy="60" r="10" fill="#ff6b7a"/><circle cx="90" cy="60" r="10" fill="#f7c948"/><circle cx="120" cy="60" r="10" fill="#5ad58b"/>
  <text x="160" y="69" fill="#f4f6fb" font-family="Arial, sans-serif" font-size="25" font-weight="700">Extension Module Workbench</text>
  <rect x="28" y="116" width="704" height="556" rx="18" fill="#171c27" stroke="#30384d"/>
  <rect x="756" y="116" width="416" height="556" rx="18" fill="#171c27" stroke="#30384d"/>
  <g font-family="Arial, sans-serif" fill="#aeb7ca" font-size="16">
    <text x="58" y="158">Module ID</text><text x="394" y="158">Module name</text>
    <text x="58" y="250">Author</text><text x="394" y="250">Language</text>
    <text x="58" y="342">Description</text>
  </g>
  <g fill="#0e1118" stroke="#39435a">
    <rect x="58" y="172" width="300" height="50" rx="10"/><rect x="394" y="172" width="300" height="50" rx="10"/>
    <rect x="58" y="264" width="300" height="50" rx="10"/><rect x="394" y="264" width="300" height="50" rx="10"/>
    <rect x="58" y="356" width="636" height="112" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#e8ebf2" font-size="17">
    <text x="76" y="204">safe-volume-tools</text><text x="412" y="204">Safe Volume Tools</text>
    <text x="76" y="296">YanagiKH</text><text x="412" y="296">Kotlin</text>
    <text x="76" y="390">Create a reusable extension package with settings, manifest,</text>
    <text x="76" y="416">source template, build metadata, and exportable ZIP package.</text>
  </g>
  <rect x="58" y="500" width="196" height="52" rx="12" fill="#5865f2"/><text x="105" y="533" fill="white" font-family="Arial" font-size="17">Create module</text>
  <rect x="270" y="500" width="176" height="52" rx="12" fill="#30384d"/><text x="318" y="533" fill="white" font-family="Arial" font-size="17">Export ZIP</text>
  <rect x="462" y="500" width="232" height="52" rx="12" fill="#30384d"/><text x="508" y="533" fill="white" font-family="Arial" font-size="17">Open mods folder</text>
  <text x="786" y="158" fill="#f4f6fb" font-family="Arial" font-size="21" font-weight="700">Generated output</text>
  <rect x="786" y="180" width="356" height="450" rx="12" fill="#0d1016"/>
  <g fill="#9fd4ff" font-family="monospace" font-size="15">
    <text x="808" y="218">{</text><text x="828" y="246">"id": "safe-volume-tools",</text>
    <text x="828" y="274">"language": "kotlin",</text><text x="828" y="302">"entry": "src/main/kotlin/</text>
    <text x="848" y="328">module/ExtensionModule.kt",</text><text x="828" y="356">"status": "created",</text>
    <text x="828" y="384">"package": "safe-volume-tools.zip"</text><text x="808" y="412">}</text>
  </g>
  <text x="28" y="692" fill="#77829b" font-family="Arial" font-size="13">Interface preview — generated documentation artwork, not a runtime screenshot.</text>
</svg>
